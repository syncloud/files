server:
  database:
    path: "{{ .DatabaseSqlite }}"
    migrateFrom: "${FILEBROWSER_MIGRATE_FROM}"
  cacheDir: "{{ .CacheDir }}"
  logging:
    - levels: "info|warning|error"
      output: "stdout"
  sources:
    - path: "/"
      name: device
      config:
        defaultEnabled: true
        readOnly: true
        defaultUserScope: "/"
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true
        rules:
          - folderPath: "/proc"
          - folderPath: "/sys"
          - folderPath: "/dev"
          - folderPath: "/run"
          - folderPath: "/var/cache"
          - folderPath: "/opt/disk"
            viewable: true
          - folderPath: "/data"
            viewable: true
    - path: "{{ .StorageDir }}"
      name: files
      config:
        defaultEnabled: true
        defaultUserScope: "/"
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true

http:
  socket: "{{ .Socket }}"
  trustProxyHeaders: true

auth:
  tokenExpirationHours: 2
  methods:
    password:
      enabled: false
    oidc:
      enabled: true
      clientId: "{{ .ClientId }}"
      clientSecret: "{{ .ClientSecret }}"
      issuerUrl: "{{ .AuthUrl }}"
      scopes: "openid email profile groups"
      userIdentifier: "preferred_username"
      groupsClaim: "groups"
      adminGroup: "{{ .AdminGroup }}"

userDefaults:
  account:
    permissions:
      share: true

frontend:
  name: Files
